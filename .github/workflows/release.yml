name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build plugin archive
        run: git archive --format=zip --prefix=wpstow/ --output="wpstow-${GITHUB_REF_NAME}.zip" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "wpstow-${GITHUB_REF_NAME}.zip" --generate-notes --title "$GITHUB_REF_NAME"
